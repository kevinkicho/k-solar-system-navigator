# Firebase App Hosting — HELIOS Mission Design
# Docs: https://firebase.google.com/docs/app-hosting
#
# Requires Blaze plan. Backend id is set in firebase.json (apphosting.backendId).
# rootDir is web/; monorepo parent (../js) is available at build for prepare:spa.

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 20
  concurrency: 80

# Explicit build ensures SPA assets are copied before next build
scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  - variable: NEXT_PUBLIC_HELIOS_PRODUCT
    value: mission-design
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_HELIOS_CLASS
    value: preliminary-not-flight-certified
    availability:
      - BUILD
      - RUNTIME
  # When monorepo parent is mounted one level up from web/
  - variable: HELIOS_SPA_ROOT
    value: ..
    availability:
      - BUILD
  # AI core — Ollama Cloud (secret via: firebase apphosting:secrets:set OLLAMA_API_KEY)
  - variable: OLLAMA_MODEL
    value: gemma4:31b-cloud
    availability:
      - RUNTIME
  - variable: OLLAMA_API_KEY
    secret: OLLAMA_API_KEY
    availability:
      - RUNTIME
